name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest

    env:
      Project_Directory: .
      Project_Path: Launchbox.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-release-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-release-
            ${{ runner.os }}-nuget-

      # Derive a valid 4-part MSIX version from the tag (e.g. v1.2.3 → 1.2.3.0)
      - name: Compute MSIX version
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $base = ($tag -split '-')[0]
          $parts = $base.Split('.')
          $ver = if ($parts.Count -ge 3) { "$($parts[0]).$($parts[1]).$($parts[2]).0" } else { "$base.0" }
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "MSIX version: $ver"

      - name: Decode and install the pfx
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String($env:BASE64_PFX)
          $certificatePath = Join-Path -Path $env:Project_Directory -ChildPath GitHubActionsWorkflow.pfx
          [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)
          $pwd = ConvertTo-SecureString -String $env:PFX_KEY -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath "$certificatePath" -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        env:
          BASE64_PFX: ${{ secrets.Base64_Encoded_Pfx }}
          PFX_KEY: ${{ secrets.Pfx_Key }}

      - name: Build and package MSIX
        run: >-
          dotnet build $env:Project_Path
          --configuration Release
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxBundle=Always
          -p:AppxBundlePlatforms="x64|arm64"
          -p:GenerateAppxPackageOnBuild=true
          -p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT
          -p:AppxPackageVersion=$env:APP_VERSION
          -p:NoWarn=APPX0107
          -p:AppxSymbolPackageEnabled=false

      # Clean up signing material from disk and cert store immediately after packaging
      - name: Remove pfx and cert
        if: always()
        run: |
          Remove-Item -Path $env:Project_Directory\GitHubActionsWorkflow.pfx -ErrorAction SilentlyContinue
          if ($env:CERT_THUMBPRINT) {
            Get-ChildItem Cert:\CurrentUser\My\$env:CERT_THUMBPRINT -ErrorAction SilentlyContinue | Remove-Item
          }

      # Attest the bundle before publishing — links artifact to this workflow run
      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: AppPackages/**/*.msixbundle

      - name: Cache dotnet global tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-cyclonedx-6.1.1

      # Generate a CycloneDX SBOM scoped to NuGet transitive dependencies
      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX --version 6.1.1
          dotnet CycloneDX $env:Project_Path --json --out sbom-output
          Rename-Item -Path sbom-output\bom.json -NewName launchbox-sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: sbom-output/launchbox-sbom.cdx.json

      - name: Create GitHub Release
        run: |
          $bundle = Get-ChildItem -Recurse AppPackages -Filter "*.msixbundle" | Select-Object -First 1
          if (-not $bundle) { Write-Error "No .msixbundle found in AppPackages"; exit 1 }
          $releaseArgs = @("${{ github.ref_name }}", "--title", "${{ github.ref_name }}", "--generate-notes", $bundle.FullName, "sbom-output\launchbox-sbom.cdx.json")
          if ("${{ github.ref_name }}" -match '-') { $releaseArgs += "--prerelease" }
          gh release create @releaseArgs
        env:
          GH_TOKEN: ${{ github.token }}
