name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run: build, sign, and upload the package to a Partner Center draft submission
          without submitting it for certification. No GitHub Release is created.
          Use this to validate the full pipeline before an actual release.
          Select the version tag from the "Run workflow from" dropdown above.
        type: boolean
        default: true
      skip_quality_checks:
        description: >
          Emergency bypass: skip format, test, and coverage checks.
          Only use for genuine hotfixes where shipping speed outweighs test coverage.
          bypass_reason is required when this is enabled.
        type: boolean
        default: false
      bypass_reason:
        description: 'Required when skip_quality_checks is true — explain why checks are being bypassed (recorded in the release)'
        type: string
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write
  checks: write

jobs:
  release:
    name: Build, Submit, and Draft Release
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      Solution_Name: Launchbox.sln
      Project_Path: Launchbox.csproj
      Test_Project_Path: Launchbox.Tests\Launchbox.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      # Validate workflow_dispatch inputs before spending time on a build.
      # Tag push triggers bypass this step entirely.
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
          SKIP_CHECKS: ${{ inputs.skip_quality_checks }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
        run: |
          if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "This workflow must be triggered from a version tag (e.g. v1.2.3). Got: '$env:REF_NAME'. Select the tag from the 'Run workflow from' dropdown."
            exit 1
          }
          if ($env:SKIP_CHECKS -eq 'true' -and [string]::IsNullOrWhiteSpace($env:BYPASS_REASON)) {
            Write-Error "bypass_reason is required when skip_quality_checks is true. Describe why checks are being bypassed."
            exit 1
          }
          Write-Host "Dispatch validation passed. Tag: $env:REF_NAME, Dry run: ${{ inputs.dry_run }}, Skip checks: $env:SKIP_CHECKS"

      - name: Install .NET Core
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-release-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-release-
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore $env:Solution_Name --locked-mode

      # Format check is always mandatory — it runs in under 30 seconds and catches
      # malformed files that would fail the build anyway.
      - name: Verify Code Format
        run: dotnet format $env:Solution_Name --no-restore --verify-no-changes --verbosity minimal

      - name: Execute unit tests
        id: run_tests
        if: inputs.skip_quality_checks != 'true'
        run: dotnet test $env:Test_Project_Path --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

      - name: Check coverage threshold
        if: inputs.skip_quality_checks != 'true'
        run: |
          $file = Get-ChildItem -Recurse -Filter "coverage.cobertura.xml" ./TestResults | Select-Object -First 1
          if (-not $file) { Write-Error "No coverage file found"; exit 1 }
          $xml = [xml](Get-Content $file.FullName)
          $rate = [float]::Parse($xml.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
          $pct = [math]::Round($rate * 100, 1)
          Write-Host "Line coverage (production code): $pct%"
          if ($rate -lt 0.80) {
            Write-Error "Coverage $pct% is below the 80% minimum threshold"
            exit 1
          }
          Write-Host "Coverage check passed ($pct%)"

      # Guard against the test reporter crashing when tests were skipped via skip_quality_checks.
      - name: Publish Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always() && steps.run_tests.outcome != 'skipped'
        with:
          name: Release Test Results
          path: "**/test-results.trx"
          reporter: dotnet-trx

      # Derive a valid 4-part MSIX version from the tag (e.g. v1.2.3 → 1.2.3.0, v1.2.3-beta.1 → 1.2.3.0)
      - name: Compute MSIX version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME.TrimStart('v')
          $base = ($tag -split '-')[0]
          $parts = $base.Split('.')
          $ver = if ($parts.Count -ge 3) { "$($parts[0]).$($parts[1]).$($parts[2]).0" } else { "$base.0" }
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "MSIX version: $ver"

      - name: Decode and install the pfx
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String($env:BASE64_PFX)
          $certificatePath = Join-Path -Path $env:RUNNER_TEMP -ChildPath GitHubActionsWorkflow.pfx
          # Write path immediately so cleanup step can find the file even if later steps fail
          echo "PFX_PATH=$certificatePath" >> $env:GITHUB_ENV
          [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)
          $pwd = ConvertTo-SecureString -String $env:PFX_KEY -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath "$certificatePath" -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        env:
          BASE64_PFX: ${{ secrets.Base64_Encoded_Pfx }}
          PFX_KEY: ${{ secrets.Pfx_Key }}

      - name: Build and package MSIX
        run: >-
          dotnet build $env:Project_Path
          --no-restore
          --configuration Release
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxBundle=Always
          -p:AppxBundlePlatforms="x64|arm64"
          -p:GenerateAppxPackageOnBuild=true
          -p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT
          -p:AppxPackageVersion=$env:APP_VERSION
          -p:NoWarn=APPX0107
          -p:AppxSymbolPackageEnabled=false

      # Always clean up signing material — even if packaging fails mid-run
      - name: Remove pfx and cert
        if: always()
        run: |
          Remove-Item -Path "$env:PFX_PATH" -ErrorAction SilentlyContinue
          if ($env:CERT_THUMBPRINT) {
            Get-ChildItem Cert:\CurrentUser\My\$env:CERT_THUMBPRINT -ErrorAction SilentlyContinue | Remove-Item
          }

      - name: Attest MSIX bundle
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: AppPackages/**/*.msixbundle

      - name: Generate SBOM
        run: |
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX $env:Project_Path --json --out sbom-output
          Rename-Item -Path sbom-output\bom.json -NewName launchbox-sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: sbom-output/launchbox-sbom.cdx.json

      # Install the MSStore Developer CLI — the official Microsoft tool for Store submissions.
      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@b76227f539d68e6465f79bbbc82ed92f61081aa4 # v1.3

      - name: Configure Microsoft Store Developer CLI
        run: |
          msstore settings --enableTelemetry false
          msstore reconfigure `
            --tenantId $env:AZURE_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:AZURE_CLIENT_ID `
            --clientSecret $env:AZURE_CLIENT_SECRET
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Dry run: uploads the package to a Partner Center draft submission but does NOT submit
      # it for certification (--noCommit). Useful for validating the full pipeline pre-release.
      # Normal run: commits the submission and kicks off Store certification.
      - name: Submit to Microsoft Store
        env:
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $msixupload = Get-ChildItem -Recurse AppPackages -Filter "*.msixupload" | Select-Object -First 1
          if (-not $msixupload) { Write-Error "No .msixupload found in AppPackages"; exit 1 }
          $publishArgs = @('.', '--inputFile', $msixupload.FullName, '--appId', $env:STORE_PRODUCT_ID)
          if ($env:DRY_RUN -eq 'true') {
            $publishArgs += '--noCommit'
            Write-Host "Dry run: package will be uploaded to a Partner Center draft but not submitted for certification."
          }
          msstore publish @publishArgs

      # Create a draft release — invisible to users until store-sync.yml publishes it after certification.
      # Skipped on dry runs (no certification is triggered, so there is nothing to publish later).
      # Tags with a pre-release suffix (e.g. v1.2.3-beta.1) are marked as pre-release.
      - name: Create draft GitHub Release
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $bundle = Get-ChildItem -Recurse AppPackages -Filter "*.msixbundle" | Select-Object -First 1
          if (-not $bundle) { Write-Error "No .msixbundle found in AppPackages"; exit 1 }
          $releaseArgs = @(
            $env:REF_NAME,
            "--title", $env:REF_NAME,
            "--generate-notes",
            "--draft",
            $bundle.FullName,
            "sbom-output\launchbox-sbom.cdx.json"
          )
          if ($env:REF_NAME -match '-') { $releaseArgs += "--prerelease" }
          gh release create @releaseArgs

      # When quality checks are bypassed, append an audit notice to the draft release body
      # so the bypass is permanently visible in the release history.
      - name: Annotate release with bypass notice
        if: inputs.skip_quality_checks == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
          ACTOR: ${{ github.actor }}
        run: |
          $existing  = gh release view $env:REF_NAME --json body | ConvertFrom-Json | Select-Object -ExpandProperty body
          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')
          $notice    = "`n`n---`n> **:warning: Quality gate bypassed** by @$env:ACTOR on $timestamp`n> **Reason:** $env:BYPASS_REASON"
          gh release edit $env:REF_NAME --notes "$existing$notice"
