name: "Pull Request Labeler"

on:
  - pull_request_target

jobs:
  triage:
    # Dependabot already applies correct labels (dependencies, github_actions, etc.).
    # Running labeler on top would strip those labels via sync-labels, so skip it.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Apply PR Labels
        uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
