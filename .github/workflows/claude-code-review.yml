name: Claude Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.CLAUDE_PAT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in this repository.

            Fetch the diff with: gh pr diff ${{ github.event.pull_request.number }}

            Focus on code quality, potential bugs, and adherence to the project's coding
            standards documented in CLAUDE.md.

            When done, post your complete review as a comment on the PR:
            gh pr comment ${{ github.event.pull_request.number }} --body "your review text"
          allowed_bots: "*"
          claude_args: "--allowed-tools Bash(gh pr:*)"
          show_full_output: true
