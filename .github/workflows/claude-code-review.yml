name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: read-all

jobs:
  claude-review:
    # Dependabot PRs cannot access repository secrets (GitHub security restriction),
    # so the OAuth token would be empty. Skip review — SHA bumps don't need it.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1
        with:
          github_token: ${{ secrets.CLAUDE_PAT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            EVENT TYPE: ${{ github.event_name }}/${{ github.event.action }}

            Perform a thorough code review of this pull request. Start by fetching the
            diff, then review all changed files.

            ## Review Areas

            1. **Code Quality & Standards**
               - Adherence to conventions in CLAUDE.md (naming, formatting, async/await,
                 error handling, nullable reference types, modern C# 12+ idioms)
               - No unnecessary complexity, premature abstractions, or over-engineering
               - Comments explain *why*, not *what* — no redundant prose comments

            2. **Correctness & Bugs**
               - Logic errors, off-by-one issues, null dereferences
               - Async/threading issues (e.g. fire-and-forget without `_ =`, missing
                 ConfigureAwait, UI thread violations in WinUI 3)
               - Win32/P/Invoke correctness (SetLastError, handle lifetimes)

            3. **Security**
               - Path traversal, injection risks, unsafe file operations
               - Validate that new P/Invoke declarations are in NativeMethods.cs
               - No secrets or credentials hardcoded

            4. **WinUI 3 / XAML**
               - x:Bind vs {Binding} used correctly (out-of-tree elements must use {Binding})
               - No SetConverterLookupRoot issues from converters in Window context
               - New services wired up in MainWindow constructor

            5. **Testing**
               - New testable classes linked in Launchbox.Tests/Launchbox.Tests.csproj
               - Tests use MockStringProvider / other existing mocks where applicable
               - No mocking of real file system or settings unless via the service interfaces

            6. **Localization**
               - New UI strings added to all 13 .resw files (en-US, es, fr, de, it, ja,
                 ko, pl, pt-BR, ru, tr, zh-Hans, zh-Hant)
               - XAML uses x:Uid for in-tree elements; code-behind uses Localization.GetString()

            ## Thread Resolution (synchronize events only)

            When this review is triggered by a `synchronize` event (new commits pushed),
            BEFORE posting new inline comments:

            1. Fetch all unresolved review threads via GraphQL:
               ```bash
               gh api graphql -f query='{
                 repository(owner: "OWNER", name: "REPO") {
                   pullRequest(number: PR_NUMBER) {
                     reviewThreads(first: 50) {
                       nodes {
                         id isResolved isOutdated
                         comments(first: 1) {
                           nodes { body path line author { login } }
                         }
                       }
                     }
                   }
                 }
               }'
               ```
            2. For each unresolved thread, examine the current file content at that path
               using `gh api repos/OWNER/REPO/contents/PATH?ref=HEAD_SHA` or the PR diff
               to determine whether the concern was addressed in the new commits.
            3. Resolve threads where the issue is fixed using:
               ```bash
               gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "THREAD_ID"}) { thread { id isResolved } } }'
               ```
               Resolve a thread if: the thread is outdated AND the concern it raised is no
               longer present in the current code, OR the change clearly and directly
               addresses the feedback.
            4. Do NOT resolve threads where the issue persists or where the fix is unclear.
            5. Post a top-level comment summarising what was resolved and what still needs
               attention — do this before any new inline comments.

            ## Output Format

            - Post **inline comments** using `mcp__github_inline_comment__create_inline_comment`
              for concrete issues or suggestions on specific lines
            - Post the **top-level summary** using `gh pr comment --body "..."` — you MUST
              use this Bash command for the summary, NOT the inline comment tool. The summary
              should cover: what the PR does, overall assessment, and any blocking issues.
            - Skip inline comments for nitpicks that don't affect correctness or standards
            - If the PR AUTHOR is "app/google-labs-jules" and there are blocking issues
              or required changes, end the top-level summary with:
              "@jules please address the issues noted above"

          allowed_bots: '*'
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(gh api graphql:*)"
