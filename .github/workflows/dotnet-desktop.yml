name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # CodeQL scan weekly (Monday 6 AM UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  checks: write
  actions: read

jobs:

  analyze:
    name: Security Scan (CodeQL)
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-analyze-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          languages: csharp
          build-mode: none

      - name: Perform Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4

  build:
    # Skip build/test on scheduled runs — schedule is for CodeQL only
    if: github.event_name != 'schedule'

    timeout-minutes: 20

    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true

    runs-on: windows-latest

    env:
      Solution_Name: Launchbox.sln
      Project_Path: Launchbox.csproj
      Test_Project_Path: Launchbox.Tests\Launchbox.Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name --locked-mode

    - name: Verify Code Format
      run: dotnet format $env:Solution_Name --no-restore --verify-no-changes --verbosity minimal

    - name: Execute unit tests
      run: dotnet test $env:Test_Project_Path --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

    # Fail the build if line coverage of production code drops below 80%
    - name: Check coverage threshold
      run: |
        $file = Get-ChildItem -Recurse -Filter "coverage.cobertura.xml" ./TestResults | Select-Object -First 1
        if (-not $file) { Write-Error "No coverage file found"; exit 1 }
        $xml = [xml](Get-Content $file.FullName)
        $rate = [float]::Parse($xml.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
        $pct = [math]::Round($rate * 100, 1)
        Write-Host "Line coverage (production code): $pct%"
        if ($rate -lt 0.80) {
          Write-Error "Coverage $pct% is below the 80% minimum threshold"
          exit 1
        }
        Write-Host "Coverage check passed ($pct%)"

    - name: Publish Test Report
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
      if: always()
      with:
        name: Unit Test Results
        path: "**/test-results.trx"
        reporter: dotnet-trx

    - name: Upload coverage report
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      if: always()
      with:
        name: Coverage Report
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

    # Build the full WinUI app to catch XAML/binding compile errors
    - name: Build the application
      run: dotnet build $env:Project_Path --no-restore --configuration Release -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
