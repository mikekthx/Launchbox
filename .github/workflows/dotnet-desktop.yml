name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # CodeQL scan weekly (Monday 6 AM UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  checks: write
  actions: read

jobs:

  analyze:
    name: Security Scan (CodeQL)
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-analyze-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: csharp
          build-mode: none

      - name: Perform Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

  build:
    # Skip build/test on scheduled runs — schedule is for CodeQL only
    if: github.event_name != 'schedule'

    timeout-minutes: 20

    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true

    runs-on: windows-latest

    env:
      Solution_Name: Launchbox.sln
      Project_Path: Launchbox.csproj
      Test_Project_Path: Launchbox.Tests\Launchbox.Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name --locked-mode

    - name: Verify Code Format
      run: dotnet format $env:Solution_Name --no-restore --verify-no-changes --verbosity minimal

    - name: Execute unit tests
      run: dotnet test $env:Test_Project_Path --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

    # Fail the build if line coverage of production code drops below 80%
    - name: Check coverage threshold
      run: |
        $file = Get-ChildItem -Recurse -Filter "coverage.cobertura.xml" ./TestResults | Select-Object -First 1
        if (-not $file) { Write-Error "No coverage file found"; exit 1 }
        $xml = [xml](Get-Content $file.FullName)
        $rate = [float]::Parse($xml.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
        $pct = [math]::Round($rate * 100, 1)
        Write-Host "Line coverage (production code): $pct%"
        if ($rate -lt 0.80) {
          Write-Error "Coverage $pct% is below the 80% minimum threshold"
          exit 1
        }
        Write-Host "Coverage check passed ($pct%)"

    - name: Publish Test Report
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
      if: always()
      with:
        name: Unit Test Results
        path: "**/test-results.trx"
        reporter: dotnet-trx

    - name: Upload coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: Coverage Report
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

    # Build the full WinUI app to catch XAML/binding compile errors
    - name: Build the application
      run: dotnet build $env:Project_Path --no-restore --configuration Release -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
