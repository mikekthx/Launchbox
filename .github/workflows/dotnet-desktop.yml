name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Full CodeQL scan weekly (Monday 6 AM UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  checks: write

jobs:

  # Fast extractorless scan on PRs; full build-traced scan on push to main
  analyze:
    name: Security Scan (CodeQL)
    runs-on: windows-latest
    env:
      Solution_Name: Launchbox.sln
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL (extractorless — PR only)
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Initialize CodeQL (build-traced — push/schedule)
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Install .NET Core
        if: github.event_name != 'pull_request'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-codeql-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-codeql-

      - name: Pre-create Source Generator Folders
        if: github.event_name != 'pull_request'
        run: |
          New-Item -ItemType Directory -Force -Path "obj\Gen\WinRT.SourceGenerator\Generator.WinRTAotSourceGenerator"
          New-Item -ItemType Directory -Force -Path "obj\Gen\WinRT.SourceGenerator\Generator.WinRTSourceGenerator"

      - name: Build for CodeQL analysis
        if: github.event_name != 'pull_request'
        run: |
          dotnet restore $env:Solution_Name
          dotnet build $env:Solution_Name --configuration Debug -p:EmitCompilerGeneratedFiles=true -p:CompilerGeneratedFilesOutputPath=obj\Gen -p:AppxPackageSigningEnabled=false

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  build:
    # Skip build/test/package on scheduled runs (schedule is for CodeQL only)
    if: github.event_name != 'schedule'

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Launchbox.sln
      Project_Directory: .
      Project_Path: Launchbox.csproj
      Test_Project_Path: Launchbox.Tests\Launchbox.Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    # Check if the code follows your style rules
    - name: Verify Code Format
      run: dotnet format $env:Solution_Name --verify-no-changes --verbosity minimal

    # Cache NuGet packages to speed up future builds
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Cache MSBuild intermediate files for incremental builds
    - name: Cache MSBuild obj folders
      uses: actions/cache@v5
      with:
        path: '**/obj'
        key: ${{ runner.os }}-obj-${{ matrix.configuration }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-obj-${{ matrix.configuration }}-

    # Execute all unit tests in the specific test project
    - name: Execute unit tests
      run: dotnet test $env:Test_Project_Path --configuration ${{ matrix.configuration }} --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    # Turn that TRX file into a beautiful UI report in GitHub
    - name: Publish Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Unit Test Results (${{ matrix.configuration }})
        path: "**/test-results.trx"
        reporter: dotnet-trx

    # Build the full WinUI app to catch XAML/binding compile errors (tests only link a subset of files)
    - name: Build the application
      run: dotnet build $env:Project_Path --configuration ${{ matrix.configuration }} -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: dotnet restore $env:Solution_Name
      env:
        Configuration: ${{ matrix.configuration }}

    # Decode and install the base 64 encoded pfx
    - name: Decode and install the pfx
      if: github.event_name != 'pull_request'
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Project_Directory -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)
        $pwd = ConvertTo-SecureString -String "${{ secrets.Pfx_Key }}" -Force -AsPlainText
        $cert = Import-PfxCertificate -FilePath "$certificatePath" -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
        echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

    # Create the app package by building and packaging the single-project MSIX
    - name: Create the app package
      if: github.event_name != 'pull_request'
      run: dotnet build $env:Project_Path --configuration $env:Configuration -p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode -p:AppxBundle=$env:Appx_Bundle -p:GenerateAppxPackageOnBuild=true -p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT -p:NoWarn=APPX0107 -p:AppxPackageVersion=1.0.0.${{ github.run_number }} -p:AppxSymbolPackageEnabled=false
      env:
        Appx_Bundle: Always
        Appx_Bundle_Platforms: x64|arm64
        Appx_Package_Build_Mode: StoreUpload
        Configuration: ${{ matrix.configuration }}

    # Remove the pfx
    - name: Remove the pfx
      if: github.event_name != 'pull_request'
      run: Remove-Item -path $env:Project_Directory\GitHubActionsWorkflow.pfx

    # Upload the MSIX package
    - name: Upload build artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: MSIX Package - ${{ matrix.configuration }}
        path: ${{ env.Project_Directory }}\AppPackages

    # Generate the unforgeable birth certificate for the installer
    - name: Generate artifact attestation
      if: github.event_name != 'pull_request'
      uses: actions/attest@v4
      with:
        subject-path: AppPackages/**/*.msi*
