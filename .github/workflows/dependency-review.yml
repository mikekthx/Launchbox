name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'global.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore packages
        # --locked-mode is intentionally absent: this job runs on ubuntu-latest for speed,
        # and NuGet lock file validation is OS-sensitive for Windows-targeted projects.
        # Locked restore is enforced by the windows-latest build and release workflows.
        run: dotnet restore Launchbox.sln

      - name: Submit dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@31f25a8de68ae5ce2ca274bc28546a78683c15ce # v0.1.4
        with:
          detectorsCategories: NuGet

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true
