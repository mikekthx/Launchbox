name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'global.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
