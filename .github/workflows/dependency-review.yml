name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'global.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Restore packages
        # --locked-mode is intentionally absent: this job runs on ubuntu-latest for speed,
        # and NuGet lock file validation is OS-sensitive for Windows-targeted projects.
        # Locked restore is enforced by the windows-latest build and release workflows.
        run: dotnet restore Launchbox.sln

      - name: Submit dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@9c110eb34dee187cd9eca76a652b9f6a0ed22927 # v0.1.1
        with:
          detectorsCategories: NuGet

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true
